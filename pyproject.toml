[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-playbook-generator"
version = "0.1.0"
description = "CLI Python pour generer des playbooks SOC operationnels au format Markdown."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Ilyes" }
]
keywords = ["cybersecurity", "soc", "incident-response", "playbook", "markdown"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Monitoring"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
soc-playbook-generator = "soc_playbook_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["soc_playbook_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
